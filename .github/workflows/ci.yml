name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The checks are independent, so they run side by side: lint, typecheck, and unit
# tests as one matrix, the browser suite as its own job. Wall time is the slowest
# job, not the sum of them.
jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.check }}

  e2e:
    name: browser (Chromium + WebKit, desktop to phone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # WebKit is Safari's engine — what every iPhone and iPad browser runs.
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Build static export
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      # Playwright spreads the three device projects across workers in parallel.
      - run: npm run test:e2e
      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
