name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every check runs side by side, so wall time is the slowest job, not the sum. The
# browser suite, by far the slowest, is split by device: one job per Playwright
# project, and each WebKit project — about three times slower than Chromium — in two
# shards. A pull request that touches only docs skips the unit and browser suites.
jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request checks out its merge commit: parent 1 is main, so the
          # diff between them is exactly what the pull request changes.
          fetch-depth: 2
      - id: diff
        name: Is anything besides docs changed?
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --name-only HEAD^1 HEAD | tee changed.txt
          # Docs, specs, and source originals never reach the build or the tests.
          if grep -qvE '\.md$|^specs/|^assets/|^\.claude/' changed.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: ${{ matrix.check }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - if: matrix.check != 'test' || needs.changes.outputs.code == 'true'
        run: npm run ${{ matrix.check }}

  e2e:
    name: browser (${{ matrix.project }}${{ matrix.shard != '1/1' && format(' {0}', matrix.shard) || '' }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: desktop, browser: chromium, shard: 1/1 }
          - { project: tablet-touch, browser: chromium, shard: 1/1 }
          - { project: phone-touch, browser: chromium, shard: 1/1 }
          # WebKit is Safari's engine — what every iPhone and iPad browser runs.
          - { project: iphone-webkit, browser: webkit, shard: 1/2 }
          - { project: iphone-webkit, browser: webkit, shard: 2/2 }
          - { project: ipad-webkit, browser: webkit, shard: 1/2 }
          - { project: ipad-webkit, browser: webkit, shard: 2/2 }
          - { project: ipad-portrait-webkit, browser: webkit, shard: 1/2 }
          - { project: ipad-portrait-webkit, browser: webkit, shard: 2/2 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      # Downloads the browser only on a cache miss; the system libraries always.
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build static export
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.project }}-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  # The one check main's ruleset requires: it passes only if every job above
  # passed, or was skipped because the pull request changed only docs. Requiring
  # this instead of each job by name means a job added or renamed later is covered
  # automatically, never silently dropped.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, checks, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Every CI job passed
        run: |
          echo "changes: ${{ needs.changes.result }}  checks: ${{ needs.checks.result }}  e2e: ${{ needs.e2e.result }}"
          test "${{ needs.changes.result }}" = success
          test "${{ needs.checks.result }}" = success
          case "${{ needs.e2e.result }}" in
            success) ;;
            skipped) test "${{ needs.changes.outputs.code }}" = false ;;
            *) exit 1 ;;
          esac
